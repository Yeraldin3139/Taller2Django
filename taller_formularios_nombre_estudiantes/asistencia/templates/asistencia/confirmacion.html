<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .confirmation-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            color: #11998e;
            margin-bottom: 15px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .message {
            color: #555;
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            border-left: 5px solid #11998e;
        }

        .info-box p {
            color: #00695c;
            font-size: 1em;
            margin: 10px 0;
            font-weight: 500;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .decorative-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, #11998e, transparent);
            margin: 30px 0;
        }

        @media (max-width: 768px) {
            .confirmation-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 2em;
            }

            .success-icon {
                font-size: 4em;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="success-icon">✅</div>
        <h1>¡Registro Exitoso!</h1>
        <p class="message">
            Su asistencia ha sido registrada correctamente en el sistema.
        </p>

        <div class="decorative-line"></div>

        <div class="info-box">
            <p>📌 Los datos han sido almacenados en la base de datos</p>
            <p>🔍 Puede consultar el registro en el panel de administración</p>
            <p>✨ Gracias por completar el formulario</p>
        </div>

        <div class="btn-container">
            <a href="{% url 'asistencia:registrar' %}" class="btn btn-primary">
                Registrar Nueva Asistencia
            </a>
            <a href="/admin/" class="btn btn-secondary">
                Ir al Panel de Administración
            </a>
        </div>
    </div>
</body>
</html>
